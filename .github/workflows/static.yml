<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MonoMarket — Mercados de predicción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B211D;
    --bg-alt:#0F2A24;
    --surface:#14332C;
    --surface-hi:#1A3D34;
    --border:#24473D;
    --border-soft:#1D3A32;
    --gold:#F4B942;
    --gold-soft:#F7CA6E;
    --gold-dim:#8A6B2C;
    --yes:#3DDC97;
    --yes-dim:rgba(61,220,151,0.16);
    --no:#FF6B5E;
    --no-dim:rgba(255,107,94,0.16);
    --text:#F3F0E6;
    --text-dim:#9FB3AB;
    --text-faint:#5F7770;
    --mono-fur:#8A5A34;
    --mono-face:#E9C79A;
    --mono-ear:#7A4C2B;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
    --font-display:'Fraunces', serif;
    --font-body:'Manrope', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  img,svg{display:block;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  a{color:inherit;text-decoration:none;}

  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
    border-radius:4px;
  }

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

  .app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:60;
    display:flex;align-items:center;gap:20px;
    padding:14px 28px;
    background:rgba(15,42,36,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border-soft);
  }
  .logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .logo svg{width:34px;height:34px;}
  .logo-word{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:0.2px;}
  .logo-word b{color:var(--gold);font-weight:800;}

  .search-wrap{flex:1;max-width:420px;position:relative;display:none;}
  .search-wrap input{
    width:100%;background:var(--surface);border:1px solid var(--border);
    color:var(--text);border-radius:999px;padding:10px 16px 10px 38px;
    font-size:14px;
  }
  .search-wrap input::placeholder{color:var(--text-faint);}
  .search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-faint);}

  .top-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .balance-chip{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--border);
    padding:7px 8px 7px 12px;border-radius:999px;
  }
  .balance-chip .coin{width:16px;height:16px;color:var(--gold);flex-shrink:0;}
  .balance-amt{font-family:var(--font-mono);font-size:13px;font-weight:600;white-space:nowrap;}
  .balance-cur{color:var(--text-faint);font-size:11px;margin-left:2px;}
  .deposit-btn{
    background:var(--gold);color:#1C1305;border:none;font-weight:700;font-size:12.5px;
    padding:7px 14px;border-radius:999px;transition:transform .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .deposit-btn:hover{background:var(--gold-soft);transform:translateY(-1px);}

  .icon-btn{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--border);
    background:var(--surface);display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);position:relative;flex-shrink:0;transition:background .15s ease,color .15s ease;
  }
  .icon-btn:hover{background:var(--surface-hi);color:var(--text);}
  .icon-btn svg{width:17px;height:17px;}
  .dot-badge{
    position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;
    background:var(--no);border:1.5px solid var(--bg-alt);
  }

  .avatar{
    width:36px;height:36px;border-radius:50%;background:var(--gold-dim);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);
    font-weight:700;font-size:12px;color:var(--gold-soft);border:1px solid var(--border);
    flex-shrink:0;
  }

  /* ---------- TICKER ---------- */
  .ticker-wrap{
    background:var(--bg);border-bottom:1px solid var(--border-soft);
    overflow:hidden;position:relative;height:34px;
  }
  .ticker-wrap::before,.ticker-wrap::after{
    content:"";position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none;
  }
  .ticker-wrap::before{left:0;background:linear-gradient(90deg,var(--bg),transparent);}
  .ticker-wrap::after{right:0;background:linear-gradient(-90deg,var(--bg),transparent);}
  .ticker-track{
    display:flex;align-items:center;height:34px;width:max-content;
    animation:scroll-ticker 38s linear infinite;
  }
  .ticker-item{
    display:flex;align-items:center;gap:6px;font-family:var(--font-mono);
    font-size:12px;color:var(--text-dim);padding:0 18px;white-space:nowrap;
    border-right:1px solid var(--border-soft);
  }
  .ticker-item svg{width:12px;height:12px;color:var(--text-faint);}
  .ticker-item .tk-pct{font-weight:700;}
  .tk-up{color:var(--yes);}
  .tk-down{color:var(--no);}
  @keyframes scroll-ticker{from{transform:translateX(0);}to{transform:translateX(-50%);}}

  /* ---------- LAYOUT ---------- */
  .layout{
    display:grid;grid-template-columns:216px 1fr 296px;
    flex:1;min-height:0;
  }

  /* sidebar */
  .sidebar{
    border-right:1px solid var(--border-soft);padding:22px 14px;
    display:flex;flex-direction:column;gap:22px;
  }
  .side-title{font-size:11px;letter-spacing:1.4px;color:var(--text-faint);
    text-transform:uppercase;padding:0 10px;font-weight:700;}
  .cat-list{display:flex;flex-direction:column;gap:2px;}
  .cat-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);
    background:none;border:none;color:var(--text-dim);font-size:13.5px;font-weight:600;
    width:100%;text-align:left;border-left:2px solid transparent;transition:background .15s ease,color .15s ease;
  }
  .cat-item svg{width:16px;height:16px;flex-shrink:0;}
  .cat-item .cnt{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}
  .cat-item:hover{background:var(--surface);color:var(--text);}
  .cat-item.active{background:var(--surface-hi);color:var(--gold-soft);border-left-color:var(--gold);}
  .cat-item.active .cnt{color:var(--gold-soft);}

  .side-note{
    margin-top:auto;background:var(--surface);border:1px solid var(--border-soft);
    border-radius:var(--radius-md);padding:14px;font-size:12px;color:var(--text-dim);line-height:1.5;
  }
  .side-note b{color:var(--gold-soft);}

  /* main */
  .main{padding:30px 32px 50px;min-width:0;overflow-y:auto;}

  .hero{
    display:flex;align-items:center;gap:36px;
    background:linear-gradient(135deg,var(--bg-alt),var(--surface));
    border:1px solid var(--border-soft);border-radius:24px;
    padding:38px 40px;margin-bottom:38px;position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 85% 20%,rgba(244,185,66,0.10),transparent 55%);
    pointer-events:none;
  }
  .hero-copy{flex:1;position:relative;z-index:1;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);
    font-size:11.5px;letter-spacing:1.2px;color:var(--gold-soft);text-transform:uppercase;
    background:rgba(244,185,66,0.10);border:1px solid rgba(244,185,66,0.25);
    padding:5px 12px;border-radius:999px;margin-bottom:18px;
  }
  .eyebrow .live-pulse{width:6px;height:6px;border-radius:50%;background:var(--yes);}
  .hero h1{
    font-family:var(--font-display);font-weight:700;font-size:40px;line-height:1.12;
    margin:0 0 16px;letter-spacing:-0.5px;max-width:520px;
  }
  .hero h1 em{font-style:normal;color:var(--gold);}
  .hero p{color:var(--text-dim);font-size:15px;line-height:1.6;max-width:440px;margin:0 0 26px;}
  .hero-ctas{display:flex;align-items:center;gap:18px;}
  .btn-primary{
    background:var(--gold);color:#1C1305;border:none;font-weight:800;font-size:14px;
    padding:13px 24px;border-radius:12px;transition:transform .15s ease,background .15s ease;
  }
  .btn-primary:hover{background:var(--gold-soft);transform:translateY(-1px);}
  .link-ghost{font-size:13.5px;font-weight:700;color:var(--text-dim);border-bottom:1px solid var(--border);padding-bottom:2px;}
  .link-ghost:hover{color:var(--text);}

  .mascot-wrap{flex-shrink:0;width:220px;position:relative;z-index:1;}

  /* section head */
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;gap:16px;flex-wrap:wrap;}
  .section-head h2{font-family:var(--font-display);font-weight:700;font-size:23px;margin:0;}
  .sort-select{
    background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
    font-size:12.5px;padding:8px 12px;border-radius:999px;
  }

  .market-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;
  }

  .card{
    background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
    padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .card:hover{transform:translateY(-3px);border-color:var(--border);box-shadow:0 14px 30px -14px rgba(0,0,0,0.5);}

  .trend-flag{
    position:absolute;top:-1px;left:18px;background:var(--gold);color:#1C1305;
    font-family:var(--font-mono);font-weight:700;font-size:10px;letter-spacing:0.6px;
    padding:4px 9px 5px;border-radius:0 0 8px 8px;text-transform:uppercase;
  }

  .card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .cat-chip{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px;}
  .cat-chip svg{width:12px;height:12px;}
  .cat-chip.politica{background:rgba(244,185,66,0.12);color:var(--gold-soft);}
  .cat-chip.deportes{background:var(--yes-dim);color:var(--yes);}
  .cat-chip.entretenimiento{background:rgba(160,140,255,0.14);color:#B9A9FF;}
  .cat-chip.economia{background:rgba(120,190,255,0.14);color:#8FC3FF;}
  .vol-text{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);white-space:nowrap;}

  .card h3{font-family:var(--font-display);font-weight:600;font-size:16.5px;line-height:1.35;margin:0;}

  .opts-binary{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .opt-btn{
    position:relative;overflow:hidden;border-radius:var(--radius-sm);
    border:1px solid var(--border);background:var(--bg-alt);
    padding:12px 12px;text-align:left;
  }
  .opt-fill{position:absolute;left:0;top:0;bottom:0;z-index:0;transition:width .3s ease;}
  .opt-btn.yes .opt-fill{background:var(--yes-dim);}
  .opt-btn.no .opt-fill{background:var(--no-dim);}
  .opt-label-row{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;}
  .opt-label{font-size:13px;font-weight:700;color:var(--text);}
  .opt-pct{font-family:var(--font-mono);font-weight:700;font-size:14px;}
  .opt-btn.yes .opt-pct{color:var(--yes);}
  .opt-btn.no .opt-pct{color:var(--no);}
  .opt-btn.selected{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}

  .opts-multi{display:flex;flex-direction:column;gap:8px;}
  .opt-row{
    position:relative;overflow:hidden;border-radius:var(--radius-sm);
    border:1px solid var(--border);background:var(--bg-alt);padding:9px 12px;
  }
  .opt-row .opt-fill{background:rgba(244,185,66,0.14);}
  .opt-row.selected{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
  .opt-row .opt-label-row{font-size:12.5px;}
  .opt-row .opt-pct{color:var(--gold-soft);font-size:13px;}

  .card-foot{display:flex;align-items:center;gap:10px;padding-top:2px;}
  .stake-field{
    display:flex;align-items:center;gap:6px;background:var(--bg-alt);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:8px 10px;flex:1;min-width:0;
  }
  .stake-field span{font-family:var(--font-mono);color:var(--text-faint);font-size:12.5px;}
  .stake-field input{
    background:none;border:none;color:var(--text);font-family:var(--font-mono);
    font-size:12.5px;width:100%;min-width:0;
  }
  .predict-btn{
    background:var(--border);color:var(--text-faint);border:none;font-weight:700;font-size:12.5px;
    padding:10px 16px;border-radius:var(--radius-sm);white-space:nowrap;transition:background .15s ease,color .15s ease;
  }
  .predict-btn.ready{background:var(--gold);color:#1C1305;}
  .predict-btn.ready:hover{background:var(--gold-soft);}

  .voted-note{
    font-family:var(--font-mono);font-size:12px;color:var(--gold-soft);
    background:rgba(244,185,66,0.08);border:1px dashed rgba(244,185,66,0.35);
    border-radius:var(--radius-sm);padding:10px 12px;
  }

  /* activity aside */
  .activity{
    border-left:1px solid var(--border-soft);display:flex;flex-direction:column;min-height:0;
  }
  .activity-head{
    padding:16px 18px;border-bottom:1px solid var(--border-soft);
    display:flex;align-items:center;justify-content:space-between;
  }
  .activity-head h3{font-family:var(--font-display);font-size:15px;margin:0;font-weight:600;}
  .live-tag{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);}
  .live-tag .live-pulse{width:6px;height:6px;border-radius:50%;background:var(--yes);animation:pulse-dot 1.6s ease-in-out infinite;}
  @keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:0.3;}}

  .feed{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;}
  .feed-item{display:flex;gap:9px;animation:feed-in .3s ease;}
  @keyframes feed-in{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  .feed-avatar{
    width:28px;height:28px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);
    font-size:10px;font-weight:700;color:#0B211D;
  }
  .feed-text{font-size:12.5px;color:var(--text-dim);line-height:1.45;}
  .feed-text b{color:var(--text);font-weight:700;}
  .feed-text .fp{color:var(--gold-soft);font-weight:700;}
  .feed-time{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);margin-top:2px;}

  .activity-input{
    border-top:1px solid var(--border-soft);padding:12px 14px;display:flex;gap:8px;
  }
  .activity-input input{
    flex:1;background:var(--bg-alt);border:1px solid var(--border);color:var(--text);
    border-radius:999px;padding:9px 14px;font-size:12.5px;min-width:0;
  }
  .activity-input button{
    width:34px;height:34px;border-radius:50%;background:var(--gold);border:none;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .activity-input button svg{width:14px;height:14px;color:#1C1305;}

  /* footer */
  .footer{
    border-top:1px solid var(--border-soft);padding:16px 28px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    font-size:11.5px;color:var(--text-faint);
  }
  .footer-links{display:flex;gap:18px;flex-wrap:wrap;}
  .footer-links a:hover{color:var(--text-dim);}
  .footer-demo{font-family:var(--font-mono);}
  .age-badge{
    border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-family:var(--font-mono);
    font-weight:700;color:var(--text-dim);margin-right:8px;
  }

  /* toast */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--surface-hi);border:1px solid var(--gold-dim);color:var(--text);
    padding:12px 20px;border-radius:999px;font-size:13px;font-weight:600;
    box-shadow:0 12px 30px -10px rgba(0,0,0,0.6);opacity:0;pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){
    .ticker-track{animation:none;}
    .live-pulse{animation:none;}
    .card{transition:none;}
    .feed-item{animation:none;}
  }

  @media (max-width:1100px){
    .layout{grid-template-columns:1fr;}
    .sidebar{
      border-right:none;border-bottom:1px solid var(--border-soft);
      flex-direction:row;overflow-x:auto;padding:14px 18px;gap:0;align-items:center;
    }
    .side-title,.side-note{display:none;}
    .cat-list{flex-direction:row;gap:8px;}
    .cat-item{white-space:nowrap;border-left:none;border-bottom:2px solid transparent;border-radius:999px;background:var(--surface);}
    .cat-item.active{border-bottom-color:var(--gold);}
    .cat-item .cnt{display:none;}
    .activity{border-left:none;border-top:1px solid var(--border-soft);max-height:420px;}
    .hero{flex-direction:column;text-align:left;}
    .mascot-wrap{width:170px;}
  }
  @media (max-width:640px){
    .search-wrap{display:none;}
    .topbar{padding:12px 16px;}
    .main{padding:20px 16px 40px;}
    .hero{padding:26px 22px;}
    .hero h1{font-size:29px;}
    .balance-amt{display:none;}
    .balance-chip{padding:7px;}
  }
</style>
</head>
<body>

<!-- hidden icon symbols -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="ic-ballot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="10" width="16" height="10" rx="1.5"/>
    <path d="M4 10l2.5-5h11L20 10"/>
    <path d="M9 3.5v3M15 3.5v3"/>
    <path d="M9.5 14.5l1.8 1.8L14.5 13"/>
  </symbol>
  <symbol id="ic-ball" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M12 8l3.2 2.3-1.2 3.8h-4L8.8 10.3 12 8z"/>
    <path d="M12 3.5v4.5M6 8l-2.8-.4M18 8l2.8-.4M8.7 17.9L7.5 20.7M15.3 17.9l1.2 2.8"/>
  </symbol>
  <symbol id="ic-film" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 8.5l1.3-4h14.4l1.3 4"/>
    <rect x="3.5" y="8.5" width="17" height="11.5" rx="1.2"/>
    <path d="M7.2 4.5L8.6 8.5M12 4.5l1.4 4M16.8 4.5l1.4 4"/>
  </symbol>
  <symbol id="ic-coin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="7" rx="8" ry="3.2"/>
    <path d="M4 7v10c0 1.77 3.58 3.2 8 3.2s8-1.43 8-3.2V7"/>
    <path d="M4 12.3c0 1.77 3.58 3.2 8 3.2s8-1.43 8-3.2"/>
  </symbol>
  <symbol id="ic-flame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5c1 3 4.5 5 4.5 9a5.5 5.5 0 11-11 0c0-1.5.6-2.5 1.3-3.4.2 1.4 1 2 1 2-.5-3 1-4 1-6.5.7 1 1.2 1.5 1.2 1.5S11 4 12 2.5z"/>
  </symbol>
  <symbol id="ic-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
  </symbol>
  <symbol id="ic-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 15.5V11a6 6 0 10-12 0v4.5L4 18h16l-2-2.5z"/><path d="M10 21a2 2 0 004 0"/>
  </symbol>
  <symbol id="ic-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 12a8 8 0 1114.5 4.6L20 20l-3.6-1.2A8 8 0 014 12z"/>
  </symbol>
  <symbol id="ic-send" viewBox="0 0 24 24" fill="currentColor">
    <path d="M3 11.5L20.5 4 13 21.5l-2.4-7.1L3 11.5z"/>
  </symbol>
</svg>

<div class="app">

  <!-- HEADER -->
  <header class="topbar">
    <div class="logo">
      <svg viewBox="0 0 64 64">
        <circle cx="14" cy="22" r="9" fill="var(--mono-ear)"/>
        <circle cx="50" cy="22" r="9" fill="var(--mono-ear)"/>
        <circle cx="32" cy="32" r="22" fill="var(--mono-fur)"/>
        <ellipse cx="32" cy="36" rx="13.5" ry="11.5" fill="var(--mono-face)"/>
        <circle cx="25.5" cy="32" r="2.6" fill="var(--bg)"/>
        <circle cx="38.5" cy="32" r="2.6" fill="var(--bg)"/>
        <path d="M25.5 41.5 Q32 47 38.5 41.5" stroke="var(--bg)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </svg>
      <span class="logo-word"><b>Mono</b>Market</span>
    </div>

    <div class="search-wrap">
      <svg><use href="#ic-search"/></svg>
      <input type="text" placeholder="Buscar un mercado…">
    </div>

    <div class="top-right">
      <div class="balance-chip">
        <svg class="coin"><use href="#ic-coin"/></svg>
        <span class="balance-amt" id="balanceAmt">1.482.300</span>
        <span class="balance-cur">COP</span>
        <button class="deposit-btn" id="depositBtn">Depositar</button>
      </div>
      <button class="icon-btn" id="bellBtn" aria-label="Notificaciones">
        <svg><use href="#ic-bell"/></svg>
        <span class="dot-badge"></span>
      </button>
      <button class="icon-btn" aria-label="Chat">
        <svg><use href="#ic-chat"/></svg>
      </button>
      <div class="avatar" title="Tú">TU</div>
    </div>
  </header>

  <!-- TICKER -->
  <div class="ticker-wrap">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div>
        <div class="side-title">Categorías</div>
        <nav class="cat-list" id="catList">
          <button class="cat-item active" data-filter="todos"><svg><use href="#ic-flame"/></svg>Todos<span class="cnt">8</span></button>
          <button class="cat-item" data-filter="politica"><svg><use href="#ic-ballot"/></svg>Política<span class="cnt">2</span></button>
          <button class="cat-item" data-filter="deportes"><svg><use href="#ic-ball"/></svg>Deportes<span class="cnt">2</span></button>
          <button class="cat-item" data-filter="entretenimiento"><svg><use href="#ic-film"/></svg>Entretenimiento<span class="cnt">2</span></button>
          <button class="cat-item" data-filter="economia"><svg><use href="#ic-coin"/></svg>Economía<span class="cnt">2</span></button>
        </nav>
      </div>
      <div class="side-note"><b>Cómo funciona:</b> elige un resultado, define tu monto y confirma. El precio de cada opción refleja lo que la comunidad cree que va a pasar.</div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <section class="hero">
        <div class="hero-copy">
          <div class="eyebrow"><span class="live-pulse"></span>2.318 predicciones activas</div>
          <h1>Predice el futuro.<br>Gana en <em>grande</em>.</h1>
          <p>Convierte lo que sabes de política, deporte, farándula y economía en predicciones con premio. Sin adivinar a ciegas: el precio te dice qué cree la mayoría.</p>
          <div class="hero-ctas">
            <a class="btn-primary" href="#mercados">Explorar mercados</a>
            <a class="link-ghost" href="#como-funciona">¿Cómo funciona?</a>
          </div>
        </div>
        <div class="mascot-wrap">
          <svg viewBox="0 0 220 220">
            <path d="M20 175 Q70 150 110 160 Q150 170 200 110" fill="none" stroke="var(--border)" stroke-width="2" stroke-dasharray="4 5"/>
            <path d="M120 165 L165 120 L200 128" fill="none" stroke="var(--yes)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M192 118 L200 128 L189 132" fill="none" stroke="var(--yes)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="65" cy="118" r="10" fill="var(--mono-ear)"/>
            <circle cx="128" cy="118" r="10" fill="var(--mono-ear)"/>
            <circle cx="96" cy="130" r="26" fill="var(--mono-fur)"/>
            <ellipse cx="96" cy="136" rx="16" ry="13.5" fill="var(--mono-face)"/>
            <circle cx="88" cy="130" r="3" fill="var(--bg)"/>
            <circle cx="104" cy="130" r="3" fill="var(--bg)"/>
            <path d="M87 143 Q96 149 105 143" stroke="var(--bg)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            <rect x="60" y="150" width="72" height="30" rx="10" fill="var(--mono-fur)"/>
            <rect x="118" y="140" width="3" height="24" fill="var(--text-faint)"/>
            <path d="M121 140 L150 146 L121 154 Z" fill="var(--gold)"/>
          </svg>
        </div>
      </section>

      <section id="mercados">
        <div class="section-head">
          <h2>Mercados destacados</h2>
          <select class="sort-select" id="sortSelect">
            <option>Ordenar por: mayor volumen</option>
            <option>Ordenar por: más recientes</option>
            <option>Ordenar por: mayor actividad</option>
          </select>
        </div>
        <div class="market-grid" id="marketGrid"></div>
      </section>
    </main>

    <!-- ACTIVITY -->
    <aside class="activity">
      <div class="activity-head">
        <h3>Actividad en vivo</h3>
        <div class="live-tag"><span class="live-pulse"></span>1.324</div>
      </div>
      <div class="feed" id="feed"></div>
      <div class="activity-input">
        <input type="text" id="chatInput" placeholder="Escribe un mensaje…" maxlength="140">
        <button id="sendBtn" aria-label="Enviar"><svg><use href="#ic-send"/></svg></button>
      </div>
    </aside>
  </div>

  <footer class="footer">
    <div class="footer-links">
      <span class="age-badge">+18</span>
      <a href="#">Juego responsable</a>
      <a href="#">Política de privacidad</a>
      <a href="#">Términos y condiciones</a>
    </div>
    <div class="footer-demo">Interfaz de demostración — sin dinero real.</div>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){

  // ---------- DATA ----------
  const CATS = {
    politica:{label:'Política', icon:'ic-ballot', chip:'politica'},
    deportes:{label:'Deportes', icon:'ic-ball', chip:'deportes'},
    entretenimiento:{label:'Entretenimiento', icon:'ic-film', chip:'entretenimiento'},
    economia:{label:'Economía', icon:'ic-coin', chip:'economia'}
  };

  const MARKETS = [
    {id:'m1', cat:'politica', trend:true, question:'¿Quién ganará las elecciones presidenciales de Colombia en 2026?',
      vol:'$842M vol.', type:'multi',
      options:[{key:'A',label:'Candidato A',pct:34},{key:'B',label:'Candidato B',pct:29},{key:'C',label:'Candidato C',pct:18},{key:'O',label:'Otros',pct:19}]},
    {id:'m2', cat:'politica', question:'¿Se aprobará la reforma pensional antes de fin de año?',
      vol:'$210M vol.', type:'binary', options:[{key:'si',label:'Sí',pct:61},{key:'no',label:'No',pct:39}]},
    {id:'m3', cat:'deportes', trend:true, question:'¿Clasificará la Selección Colombia al próximo Mundial?',
      vol:'$1.240M vol.', type:'binary', options:[{key:'si',label:'Sí',pct:78},{key:'no',label:'No',pct:22}]},
    {id:'m4', cat:'deportes', question:'¿Quién será campeón de la Liga BetPlay este semestre?',
      vol:'$395M vol.', type:'multi',
      options:[{key:'A',label:'Equipo A',pct:25},{key:'B',label:'Equipo B',pct:22},{key:'C',label:'Equipo C',pct:20},{key:'O',label:'Otros',pct:33}]},
    {id:'m5', cat:'entretenimiento', question:'¿Quién ganará el Festival de la Leyenda Vallenata?',
      vol:'$88M vol.', type:'multi',
      options:[{key:'F',label:'Favorito',pct:41},{key:'R1',label:'Retador 1',pct:27},{key:'R2',label:'Retador 2',pct:18},{key:'O',label:'Otros',pct:14}]},
    {id:'m6', cat:'entretenimiento', question:'¿Habrá una nueva temporada del reality más visto del año?',
      vol:'$54M vol.', type:'binary', options:[{key:'si',label:'Sí',pct:55},{key:'no',label:'No',pct:45}]},
    {id:'m7', cat:'economia', question:'¿Cerrará el dólar por encima de $4.200 COP este mes?',
      vol:'$610M vol.', type:'binary', options:[{key:'si',label:'Sí',pct:47},{key:'no',label:'No',pct:53}]},
    {id:'m8', cat:'economia', question:'¿Bajará el Banco de la República la tasa de interés este trimestre?',
      vol:'$322M vol.', type:'binary', options:[{key:'si',label:'Sí',pct:66},{key:'no',label:'No',pct:34}]},
  ];

  const NAMES = ['Camila_92','Julián.R','MonoTrader','LauraP','unknown889','Santi_CO','ValeC','Kevin.M','AndreaZ','Pipe_23','NicoV','DanielaQ'];
  const AVA_COLORS = ['#3DDC97','#F4B942','#FF6B5E','#8FC3FF','#B9A9FF'];
  const FEED_VERBS = ['apostó','predijo','confirmó su predicción de'];

  let balance = 1482300;
  const balanceEl = document.getElementById('balanceAmt');
  function fmt(n){ return n.toLocaleString('es-CO'); }
  function renderBalance(){ balanceEl.textContent = fmt(balance); }
  renderBalance();

  // ---------- TOAST ----------
  const toastEl = document.getElementById('toast');
  let toastTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 2600);
  }

  // ---------- TICKER ----------
  const tickerTrack = document.getElementById('tickerTrack');
  function buildTicker(){
    const items = MARKETS.map(m=>{
      const top = m.options.reduce((a,b)=>b.pct>a.pct?b:a);
      const dir = top.pct>=50 ? 'up' : 'down';
      return `<div class="ticker-item"><svg><use href="#${CATS[m.cat].icon}"/></svg>
        <span>${m.question.length>34? m.question.slice(0,34)+'…' : m.question}</span>
        <span class="tk-pct ${dir==='up'?'tk-up':'tk-down'}">${top.pct}%</span></div>`;
    }).join('');
    tickerTrack.innerHTML = items + items; // duplicate for seamless loop
  }

  // ---------- MARKET CARDS ----------
  const grid = document.getElementById('marketGrid');
  const state = {}; // id -> {selected, voted}

  function optionMarkup(m){
    if(m.type === 'binary'){
      return `<div class="opts-binary">` + m.options.map(o=>`
        <button class="opt-btn ${o.key==='si'?'yes':'no'}" data-key="${o.key}">
          <span class="opt-fill" style="width:${o.pct}%"></span>
          <span class="opt-label-row"><span class="opt-label">${o.label}</span><span class="opt-pct">${o.pct}%</span></span>
        </button>`).join('') + `</div>`;
    }
    return `<div class="opts-multi">` + m.options.map(o=>`
      <button class="opt-row" data-key="${o.key}">
        <span class="opt-fill" style="width:${o.pct}%"></span>
        <span class="opt-label-row"><span class="opt-label">${o.label}</span><span class="opt-pct">${o.pct}%</span></span>
      </button>`).join('') + `</div>`;
  }

  function cardMarkup(m){
    const c = CATS[m.cat];
    return `
    <article class="card" data-cat="${m.cat}" data-id="${m.id}">
      ${m.trend ? '<span class="trend-flag">Tendencia</span>' : ''}
      <div class="card-top">
        <span class="cat-chip ${c.chip}"><svg><use href="#${c.icon}"/></svg>${c.label}</span>
        <span class="vol-text">${m.vol}</span>
      </div>
      <h3>${m.question}</h3>
      ${optionMarkup(m)}
      <div class="card-foot">
        <div class="stake-field"><span>$</span><input type="number" min="10000" step="10000" value="20000" data-stake></div>
        <button class="predict-btn" data-action="predict">Predecir</button>
      </div>
    </article>`;
  }

  function renderGrid(filter){
    const list = filter==='todos' ? MARKETS : MARKETS.filter(m=>m.cat===filter);
    grid.innerHTML = list.map(cardMarkup).join('');
  }

  grid.addEventListener('click', (e)=>{
    const card = e.target.closest('.card');
    if(!card) return;
    const id = card.dataset.id;
    const market = MARKETS.find(m=>m.id===id);

    const optBtn = e.target.closest('.opt-btn, .opt-row');
    if(optBtn){
      card.querySelectorAll('.opt-btn, .opt-row').forEach(b=>b.classList.remove('selected'));
      optBtn.classList.add('selected');
      state[id] = { ...(state[id]||{}), selected: optBtn.dataset.key };
      const predictBtn = card.querySelector('[data-action="predict"]');
      predictBtn.classList.add('ready');
      return;
    }

    if(e.target.closest('[data-action="predict"]')){
      const sel = state[id] && state[id].selected;
      if(!sel){ toast('Elige una opción antes de predecir.'); return; }
      const stakeInput = card.querySelector('[data-stake]');
      let stake = parseInt(stakeInput.value, 10) || 20000;
      if(stake > balance){ toast('Saldo insuficiente para ese monto.'); return; }
      const opt = market.options.find(o=>o.key===sel);

      balance -= stake;
      renderBalance();

      const foot = card.querySelector('.card-foot');
      foot.outerHTML = `<div class="voted-note">✓ Predijiste “${opt.label}” · $${fmt(stake)} COP</div>`;

      addFeedItem({ user:'Tú', verb:'confirmó su predicción de', target:`“${opt.label}” en “${market.question.slice(0,40)}${market.question.length>40?'…':''}”`, self:true });
      toast('Tu predicción quedó registrada.');
    }
  });

  // ---------- SIDEBAR FILTER ----------
  document.getElementById('catList').addEventListener('click',(e)=>{
    const btn = e.target.closest('.cat-item');
    if(!btn) return;
    document.querySelectorAll('.cat-item').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid(btn.dataset.filter);
  });

  // ---------- LIVE FEED ----------
  const feedEl = document.getElementById('feed');
  function timeAgo(){ return 'ahora'; }

  function addFeedItem({user, verb, target, self}){
    const color = self ? 'var(--gold)' : AVA_COLORS[Math.floor(Math.random()*AVA_COLORS.length)];
    const initials = user.slice(0,2).toUpperCase();
    const el = document.createElement('div');
    el.className = 'feed-item';
    el.innerHTML = `
      <div class="feed-avatar" style="background:${color}">${initials}</div>
      <div>
        <div class="feed-text"><b>${user}</b> ${verb} <span class="fp">${target}</span></div>
        <div class="feed-time">${timeAgo()}</div>
      </div>`;
    feedEl.prepend(el);
    while(feedEl.children.length > 14){ feedEl.removeChild(feedEl.lastChild); }
  }

  function randomFeedTick(){
    const user = NAMES[Math.floor(Math.random()*NAMES.length)];
    const market = MARKETS[Math.floor(Math.random()*MARKETS.length)];
    const opt = market.options[Math.floor(Math.random()*market.options.length)];
    const verb = FEED_VERBS[Math.floor(Math.random()*FEED_VERBS.length)];
    const amt = [10000,20000,30000,50000,80000][Math.floor(Math.random()*5)];
    addFeedItem({ user, verb, target:`$${fmt(amt)} a “${opt.label}”` });
  }

  // seed feed
  for(let i=0;i<6;i++) randomFeedTick();
  const feedInterval = setInterval(randomFeedTick, 4800);

  // chat input (visual, adds to feed as guest message)
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  function sendChat(){
    const val = chatInput.value.trim();
    if(!val) return;
    addFeedItem({ user:'Tú', verb:'escribió:', target:val, self:true });
    chatInput.value = '';
  }
  sendBtn.addEventListener('click', sendChat);
  chatInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendChat(); });

  // header buttons
  document.getElementById('depositBtn').addEventListener('click', ()=> toast('Esto es una demostración de interfaz — sin transacciones reales.'));
  document.getElementById('bellBtn').addEventListener('click', ()=> toast('No tienes notificaciones nuevas.'));

  // init
  buildTicker();
  renderGrid('todos');

})();
</script>
</body>
</html>
